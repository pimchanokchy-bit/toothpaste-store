<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการออเดอร์ & พิมพ์ใบปะหน้าพัสดุ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <nav class="bg-slate-800 text-white p-4 shadow no-print">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">📦 ระบบคลังสินค้า & แพ็คพัสดุ (DENTAPURE)</h1>
      <div class="space-x-3">
        <button onclick="fetchOrders()" class="bg-teal-600 hover:bg-teal-500 px-3 py-1.5 rounded text-sm">🔄 รีเฟรชข้อมูล</button>
        <a href="index.html" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-sm">← กลับหน้าร้าน</a>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto py-8 px-4 no-print">
    <div id="loading" class="text-center py-10 text-slate-500">กำลังโหลดข้อมูลออเดอร์...</div>
    <div id="orders-container" class="grid gap-4"></div>
  </main>

  <div id="label-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl">
      <div id="print-area" class="border-2 border-black p-5 bg-white text-black">
        <div class="flex justify-between items-center border-b-2 border-black pb-3 mb-3">
          <div><h2 class="font-bold text-xl">DENTAPURE SHOP</h2><p class="text-xs">ผู้ส่ง: ร้านยาสีฟันสมุนไพร โทร 02-999-9999</p></div>
          <div class="text-right"><span class="border border-black px-2 py-1 font-bold text-sm" id="lbl-orderid">ORD-000000</span><p class="text-xs mt-1">ชำระเงินแล้ว</p></div>
        </div>
        <div class="mb-4">
          <p class="text-xs font-bold text-gray-600">ผู้รับ (TO):</p>
          <p class="text-lg font-bold mt-1" id="lbl-name"></p>
          <p class="text-md font-semibold" id="lbl-phone"></p>
          <p class="text-sm mt-1" id="lbl-address"></p>
        </div>
        <div class="border-t-2 border-dashed border-black pt-3">
          <p class="text-xs font-bold mb-1">รายการสินค้าสำหรับหยิบ (Pick List):</p>
          <ul class="text-sm space-y-1 font-medium" id="lbl-items"></ul>
        </div>
      </div>
      <div class="flex justify-end gap-3 mt-5 no-print">
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 rounded-lg">ปิด</button>
        <button onclick="window.print()" class="px-5 py-2 bg-teal-600 text-white font-bold rounded-lg">🖨️ สั่งพิมพ์ใบปะหน้า</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyeEPzolQ1kq2VnIgCy7tLh0m6T8fw0w20HQ63NrnQFW3k1F1cyVX9XPYaLxn5ClKBB/exec';
    let allOrders = [];
    async function fetchOrders() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('orders-container').innerHTML = '';
      try {
        const res = await fetch(SCRIPT_URL);
        allOrders = await res.json();
        renderOrders();
      } catch (err) { alert('ดึงข้อมูลไม่ได้ ตรวจสอบ SCRIPT_URL'); }
      finally { document.getElementById('loading').style.display = 'none'; }
    }
    function renderOrders() {
      const container = document.getElementById('orders-container');
      if (allOrders.length === 0) return container.innerHTML = '<p class="text-center text-slate-500">ยังไม่มีรายการสั่งซื้อ</p>';
      allOrders.forEach((order, index) => {
        const isPacked = order.status === 'แพ็คแล้วพร้อมส่ง';
        container.innerHTML += `
          <div class="bg-white p-5 rounded-xl shadow-sm border flex flex-col md:flex-row justify-between gap-4">
            <div class="space-y-1">
              <div class="flex items-center gap-3">
                <span class="font-bold text-lg text-teal-700">${order.orderId}</span>
                <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold ${isPacked ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${order.status}</span>
                <span class="text-xs text-slate-400">${order.timestamp}</span>
              </div>
              <p class="font-semibold">${order.name} (${order.phone})</p>
              <p class="text-sm text-slate-600">${order.address}</p>
              <div class="pt-2 flex flex-wrap gap-2 text-sm">
                <span class="bg-slate-100 px-3 py-1 rounded border"><input type="checkbox" class="mr-1"> หยิบ SKU-01 (สมุนไพร): <b>${order.sku1} หลอด</b></span>
                <span class="bg-slate-100 px-3 py-1 rounded border"><input type="checkbox" class="mr-1"> หยิบ SKU-02 (ชาร์โคล): <b>${order.sku2} หลอด</b></span>
              </div>
            </div>
            <div class="flex md:flex-col justify-end gap-2 shrink-0">
              <button onclick="openLabel(${index})" class="bg-slate-800 text-white text-sm px-4 py-2 rounded-lg">🏷️ ดู/พิมพ์ใบปะหน้า</button>
              ${!isPacked ? `<button onclick="markAsPacked('${order.orderId}')" class="bg-emerald-600 text-white text-sm px-4 py-2 rounded-lg">✅ ยืนยันแพ็คสินค้าแล้ว</button>` : ''}
            </div>
          </div>`;
      });
    }
    async function markAsPacked(orderId) {
      if (!confirm(`ยืนยันแพ็คออเดอร์ ${orderId}?`)) return;
      await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'updateStatus', orderId: orderId, status: 'แพ็คแล้วพร้อมส่ง' }) });
      fetchOrders();
    }
    function openLabel(index) {
      const order = allOrders[index];
      document.getElementById('lbl-orderid').innerText = order.orderId;
      document.getElementById('lbl-name').innerText = order.name;
      document.getElementById('lbl-phone').innerText = `โทร: ${order.phone}`;
      document.getElementById('lbl-address').innerText = order.address;
      let itemsHtml = '';
      if (order.sku1 > 0) itemsHtml += `<li>[ ] SKU-01 สูตรสมุนไพรเย็นสดชื่น — จำนวน ${order.sku1} หลอด</li>`;
      if (order.sku2 > 0) itemsHtml += `<li>[ ] SKU-02 สูตรชาร์โคลฟันขาว — จำนวน ${order.sku2} หลอด</li>`;
      document.getElementById('lbl-items').innerHTML = itemsHtml;
      document.getElementById('label-modal').classList.remove('hidden');
      document.getElementById('label-modal').classList.add('flex');
    }
    function closeModal() {
      document.getElementById('label-modal').classList.add('hidden');
      document.getElementById('label-modal').classList.remove('flex');
    }
    fetchOrders();
  </script>
</body>
</html>
